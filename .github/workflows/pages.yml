name: Deploy store standards to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site.zip
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          # Windows-created ZIP files may make Info-ZIP return warning code 1
          # even though every file was extracted correctly.
          unzip -q site.zip -d _site || true
          test -f _site/index.html
          test "$(find _site -type f | wc -l)" -gt 100
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
